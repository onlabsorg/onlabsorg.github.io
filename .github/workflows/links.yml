# Checks the links of the three OnLabs.org documentation sites (STYLE.md):
# www.onlabs.org (this repository), the Texl docs and the Stilo docs. It
# checks the sources of the three: links between pages of one manual, and
# absolute links to the other sites, which break when a page there moves.
# Runs weekly, on every push and by hand.
name: links

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: onlabs
      - uses: actions/checkout@v4
        with:
          repository: onlabsorg/texl
          path: texl
      - uses: actions/checkout@v4
        with:
          repository: onlabsorg/stilo
          path: stilo

      # The manuals (Markdown): relative links are files of the manual. Links
      # to localhost (examples) and to Texl's API reference (generated by
      # rustdoc at build time, not in the sources) are skipped.
      - name: Manuals
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --exclude "/texl/docs/api/"
            --exclude-path texl/docs/src/SUMMARY.md
            --exclude-path stilo/docs/src/SUMMARY.md
            --exclude "^https://github.com/onlabsorg/[^/]+/edit/"
            onlabs/STYLE.md
            "texl/docs/src/**/*.md"
            "stilo/docs/src/**/*.md"
          fail: true

      # The landing pages (HTML): relative links point into the built site,
      # so each page is checked against its live address.
      - name: OnLabs.org landing page
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --base-url https://www.onlabs.org/ onlabs/docs/index.html
          fail: true
      - name: Texl landing page
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --base-url https://www.onlabs.org/texl/ texl/docs/site/index.html
          fail: true
      - name: Stilo landing page
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --base-url https://www.onlabs.org/stilo/ stilo/docs/site/index.html
          fail: true
